<!DOCTYPE html>
<html lang="cs">
<head>
  <link rel="icon" href="favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie (18+)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 40px; text-align: center; }
    h1 { font-size: 40px; margin-bottom: 50px; }
    .logo-img { filter: none !important; }
    .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .item { width: 90px; position: relative; }
    img { width: 100%; border-radius: 10px; filter: blur(2px); box-shadow: 0 0 15px #000; }
    .name { font-size: 14px; margin-top: 5px; color: #00aaff; }
    a { text-decoration: none; }
    .warning { color: #ff6666; font-size: 18px; margin-bottom: 40px; }
    .ad-banner { margin: 50px auto; width: 100%; max-width: 970px; min-height: 90px; text-align: center; background: #222; border-radius: 10px; padding: 10px; }
    @media (max-width: 768px) { .ad-banner { min-height: 250px; } }
    .pagination { margin: 40px 0; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pagination button { padding: 10px 16px; font-size: 16px; background: #222; color: white; border: 1px solid #444; border-radius: 50%; cursor: pointer; transition: all 0.3s ease; min-width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .pagination button:hover { background: #ff4444; border-color: #ff4444; transform: scale(1.1); }
    .pagination button.active { background: #ff4444; border-color: #ff4444; color: #fff; font-weight: bold; }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  </style>
  <!-- Adsterra Popunder + Social Bar -->
  <script src="https://pl28425825.effectivegatecpm.com/f8/aa/ab/f8aaabac33ee2bddf546f1c71602be83.js"></script>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, updateDoc, setDoc, increment, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOUcva0oduASghABPVbZIDFSF87cBDdXU",
      authDomain: "lajky-79446.firebaseapp.com",
      projectId: "lajky-79446",
      storageBucket: "lajky-79446.firebasestorage.app",
      messagingSenderId: "515757817032",
      appId: "1:515757817032:web:2fac04b37e0f266352b9fd",
      measurementId: "G-EXFFQM5WW5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    signInAnonymously(auth)
      .then(() => console.log("Anonymně přihlášen – Firebase ready"))
      .catch(error => console.error("Chyba přihlášení:", error.message));

    window.likeFunctions = {
      toggleLike: async (postavaId, type) => {  // type: 'likes' nebo 'dislikes'
        if (!db) return console.error("DB není připravené");
        const docRef = doc(db, "likes", postavaId);
        const snap = await getDoc(docRef);
        const data = snap.exists() ? snap.data() : { likes: 0, dislikes: 0 };
        const current = data[type] || 0;

        await updateDoc(docRef, { [type]: increment(current > 0 ? -1 : 1) });
      },
      listenLikes: (postavaId, callback) => {
        if (!db) return;
        const docRef = doc(db, "likes", postavaId);
        onSnapshot(docRef, (snap) => {
          const data = snap.exists() ? snap.data() : { likes: 0, dislikes: 0 };
          callback(data);
        });
      }
    };
  </script>
</head>
<body>
  <!-- Logo -->
  <div style="position: fixed; top: 20px; left: 5%; z-index: 999;">
    <a href="index.html">
      <img src="logo.png" alt="QuickPic Logo" class="logo-img" style="width: 80px; height: auto; border-radius: 50%; box-shadow: 0 0 10px #000;">
    </a>
  </div>
  <div class="warning">⚠️ 18+ NSFW obsah – pouze pro dospělé. Stránka používá cookies pro reklamy.</div>
  <h1 id="postava-name">Načítání galerie...</h1>
  <!-- Reklama nahoře -->
  <div class="ad-banner"></div>
  <script src="https://pl28425827.effectivegatecpm.com/89/a8/4c/89a84c783c65f34b2f995b0a6b4be089.js"></script>
  <script src="https://pl28425825.effectivegatecpm.com/f8/aa/ab/f8aaabac33ee2bddf546f1c71602be83.js"></script>
  <div class="gallery" id="gallery"></div>
  <!-- Paginace -->
  <div class="pagination" id="pagination"></div>
  <!-- Reklama dole -->
  <div class="ad-banner"></div>
  <a href="index.html">Zpět na výběr</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'nasta.theruss';
    const photosPerPage = 30;
    let currentPage = 1;
    let allPhotos = [];
    document.getElementById('postava-name').textContent = id + ' - Načítání fotek...';

    fetch(`postavy/${id}.txt`)
      .then(response => {
        if (!response.ok) throw new Error(`Soubor nenalezen (status ${response.status})`);
        return response.text();
      })
      .then(text => {
        const lines = text.trim().split('\n');
        allPhotos = [];
        for (let i = 0; i < lines.length; i += 2) {
          const thumb = lines[i]?.trim() || '';
          const full = lines[i + 1]?.trim() || '';
          if (full) allPhotos.push({ thumb, full });
        }
        document.getElementById('postava-name').textContent =
          allPhotos.length === 0
            ? id + ' - žádné položky'
            : id + ' - ' + allPhotos.length + ' položek';
        renderPage(currentPage);
        renderPagination();
      })
      .catch(err => {
        console.error('Chyba:', err);
        document.getElementById('postava-name').textContent = 'Postava nenalezena – zkontroluj soubor postavy/' + id + '.txt';
      });

    function renderPage(page) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      const UNIVERSAL_VIDEO_THUMB = "video-universal-thumb.png";
      const start = (page - 1) * photosPerPage;
      const end = Math.min(start + photosPerPage, allPhotos.length);
      const pagePhotos = allPhotos.slice(start, end);

      pagePhotos.forEach(f => {
        const isVideo = /\.(mp4|webm|mov)$/i.test(f.full);
        let thumbSrc = f.thumb || UNIVERSAL_VIDEO_THUMB;
        if (!thumbSrc) thumbSrc = "placeholder.jpg";

        const item = document.createElement('div');
        item.className = 'item';

        let playIcon = '';
        if (isVideo) {
          playIcon = '<div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:60px; color:#ff3366; text-shadow:0 0 12px black; pointer-events:none; opacity:0.9;">▶</div>';
        }

        item.innerHTML = `
          <a href="redirect.html?url=${encodeURIComponent(f.full)}" target="_blank" rel="noopener" style="position:relative; display:block;">
            <img src="${thumbSrc}" alt="${isVideo ? 'Video' : 'Fotka'}" loading="lazy">
            ${playIcon}
            <div class="name">Klikni pro ${isVideo ? 'VIDEO 🔥' : 'full'}</div>
          </a>
        `;

        // === Lajky + Dislajky s toggle (přidat/odebrat) ===
        const postavaId = f.thumb.split('/').pop().split('.')[0] ||
                          f.full.split('/').pop().split('.')[0] ||
                          'neznama';

        const likeContainer = document.createElement('div');
        likeContainer.style.marginTop = '8px';
        likeContainer.style.display = 'flex';
        likeContainer.style.justifyContent = 'center';
        likeContainer.style.gap = '20px';

        // Lajk tlačítko
        const likeButton = document.createElement('button');
        likeButton.innerHTML = '❤️';
        likeButton.style.background = 'transparent';
        likeButton.style.border = 'none';
        likeButton.style.cursor = 'pointer';
        likeButton.style.fontSize = '24px';
        likeButton.style.color = '#ff3366';

        const likeCount = document.createElement('span');
        likeCount.innerText = ' 0';
        likeCount.style.marginLeft = '4px';

        likeButton.appendChild(likeCount);
        likeContainer.appendChild(likeButton);

        // Dislajk tlačítko
        const dislikeButton = document.createElement('button');
        dislikeButton.innerHTML = '👎';
        dislikeButton.style.background = 'transparent';
        dislikeButton.style.border = 'none';
        dislikeButton.style.cursor = 'pointer';
        dislikeButton.style.fontSize = '24px';
        dislikeButton.style.color = '#ff3366';

        const dislikeCount = document.createElement('span');
        dislikeCount.innerText = ' 0';
        dislikeCount.style.marginLeft = '4px';

        dislikeButton.appendChild(dislikeCount);
        likeContainer.appendChild(dislikeButton);

        // Kliky s toggle (přidat/odebrat)
        likeButton.onclick = async () => {
          if (window.likeFunctions && db) {
            const docRef = doc(db, "likes", postavaId);
            const snap = await getDoc(docRef);
            const current = snap.exists() ? (snap.data().likes || 0) : 0;
            await updateDoc(docRef, { likes: increment(current > 0 ? -1 : 1) });
          }
        };

        dislikeButton.onclick = async () => {
          if (window.likeFunctions && db) {
            const docRef = doc(db, "likes", postavaId);
            const snap = await getDoc(docRef);
            const current = snap.exists() ? (snap.data().dislikes || 0) : 0;
            await updateDoc(docRef, { dislikes: increment(current > 0 ? -1 : 1) });
          }
        };

        // Real-time aktualizace
        if (window.likeFunctions) {
          window.likeFunctions.listenLikes(postavaId, (data) => {
            likeCount.innerText = ` ${data.likes || 0}`;
            dislikeCount.innerText = ` ${data.dislikes || 0}`;
          });
        }

        item.appendChild(likeContainer);
        // === konec lajků + dislajků ===

        gallery.appendChild(item);
      });
    }

    function renderPagination() {
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      const totalPages = Math.ceil(allPhotos.length / photosPerPage);
      const prev = document.createElement('button');
      prev.textContent = '◀ Předchozí';
      prev.disabled = currentPage === 1;
      prev.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderPage(currentPage);
          updatePagination();
        }
      };
      pagination.appendChild(prev);
      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, startPage + 4);
      if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);
      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.onclick = () => {
          currentPage = i;
          renderPage(currentPage);
          updatePagination();
        };
        pagination.appendChild(btn);
      }
      const next = document.createElement('button');
      next.textContent = 'Další ▶';
      next.disabled = currentPage === totalPages;
      next.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderPage(currentPage);
          updatePagination();
        }
      };
      pagination.appendChild(next);
    }

    function updatePagination() {
      const buttons = document.querySelectorAll('.pagination button');
      buttons.forEach(btn => {
        btn.className = (btn.textContent === currentPage.toString()) ? 'active' : '';
      });
    }
  </script>
</body>
</html>
