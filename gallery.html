<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png" type="image/png">

  <script async src="https://plausible.io/js/pa-LQwM-pipGzC-bcT6Ib7K_.js"></script>

    window.plausible = window.plausible || function() { (plausible.q = plausible.q || []).push(arguments) }

  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 40px; text-align: center; }
    h1 { font-size: 40px; margin-bottom: 50px; }
    .logo-img { filter: none !important; }
    .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .item { width: 90px; position: relative; }
    img { width: 100%; border-radius: 10px; filter: blur(1px); box-shadow: 0 0 15px #000; }
    .name { font-size: 14px; margin-top: 5px; color: #00aaff; }
    a { text-decoration: none; }
    .warning { color: #ff6666; font-size: 18px; margin-bottom: 40px; }
    .ad-banner { margin: 50px auto; width: 100%; max-width: 970px; min-height: 90px; text-align: center; background: #222; border-radius: 10px; padding: 10px; }
    @media (max-width: 768px) { .ad-banner { min-height: 250px; } }
    .pagination { margin: 40px 0; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pagination button { padding: 10px 16px; font-size: 16px; background: #222; color: white; border: 1px solid #444; border-radius: 50%; cursor: pointer; transition: all 0.3s ease; min-width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .pagination button:hover { background: #ff4444; border-color: #ff4444; transform: scale(1.1); }
    .pagination button.active { background: #ff4444; border-color: #ff4444; color: #fff; font-weight: bold; }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #lang-switch { position: fixed; top: 20px; right: 20px; z-index: 999; font-size: 16px; background: #222; padding: 8px 15px; border-radius: 8px; box-shadow: 0 0 10px #000; }
    #lang-switch a { color: #00aaff; margin: 0 10px; cursor: pointer; }
    #lang-switch a.active { color: #fff; font-weight: bold; }
  </style>
  <!-- Adsterra Popunder + Social Bar -->
<script src="https://demolitionculpritrape.com/pjdxv5hqgs?key=a177b5b83c938cf54c0f1d46cb30cea3"></script>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, updateDoc, setDoc, increment, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOUcva0oduASghABPVbZIDFSF87cBDdXU",
      authDomain: "lajky-79446.firebaseapp.com",
      projectId: "lajky-79446",
      storageBucket: "lajky-79446.firebasestorage.app",
      messagingSenderId: "515757817032",
      appId: "1:515757817032:web:2fac04b37e0f266352b9fd",
      measurementId: "G-EXFFQM5WW5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    signInAnonymously(auth)
      .then(() => console.log("Anonymně přihlášen – Firebase ready"))
      .catch(error => console.error("Chyba přihlášení:", error.message));

    window.likeFunctions = {
      likePost: async (postavaId) => {
        if (!db) return;
        const docRef = doc(db, "likes", postavaId);
        try {
          await updateDoc(docRef, { likes: increment(1) });
        } catch (e) {
          if (e.code === 'not-found') {
            await setDoc(docRef, { likes: 1, dislikes: 0 });
          } else {
            console.error("Chyba lajkování:", e);
          }
        }
      },
      dislikePost: async (postavaId) => {
        if (!db) return;
        const docRef = doc(db, "likes", postavaId);
        try {
          await updateDoc(docRef, { dislikes: increment(1) });
        } catch (e) {
          if (e.code === 'not-found') {
            await setDoc(docRef, { likes: 0, dislikes: 1 });
          } else {
            console.error("Chyba dislajkování:", e);
          }
        }
      },
      listenLikes: (postavaId, callback) => {
        if (!db) return;
        const docRef = doc(db, "likes", postavaId);
        onSnapshot(docRef, (snap) => {
          const data = snap.exists() ? snap.data() : { likes: 0, dislikes: 0 };
          callback(data);
        });
      }
    };
  </script>
</head>
<body>
  <!-- Logo -->
  <div style="position: fixed; top: 20px; left: 5%; z-index: 999;">
    <a href="index.html">
      <img src="logo.png" alt="QuickPic Logo" class="logo-img" style="width: 80px; height: auto; border-radius: 50%; box-shadow: 0 0 10px #000;">
    </a>
  </div>

  <!-- Jazykový přepínač -->
  <div id="lang-switch">
    <a id="lang-cs">CZ</a> | <a id="lang-en" class="active">EN</a>
  </div>

  <div class="warning" data-i18n="warning">⚠️ 18+ NSFW content – adults only. This site uses cookies for ads.</div>

  <h1 id="postava-name" data-i18n="loading">Loading gallery...</h1>

  <!-- Text "Would you like more content?" – jen jednou pod názvem postavy -->
  <div id="more-content-container" style="margin-top: 10px; font-size: 16px; color: #aaa; display: flex; justify-content: center; align-items: center; gap: 10px;">
    <span data-i18n="moreContent">Would you like more content?</span>
    <span id="more-like-count" style="margin: 0 4px; font-size: 18px; color: #ff3366;">0</span>
    <button id="more-like-btn" style="background:transparent; border:none; cursor:pointer; font-size:20px; color:#ff3366; padding:0; margin:0 4px;">❤️</button>
    <span id="more-dislike-count" style="margin: 0 4px; font-size: 18px; color: #ff3366;">0</span>
    <button id="more-dislike-btn" style="background:transparent; border:none; cursor:pointer; font-size:20px; color:#ff3366; padding:0; margin:0 4px;">👎</button>
  </div>

  <!-- Reklama nahoře -->
  <div class="ad-banner"></div>

  
  <div class="gallery" id="gallery"></div>

  <!-- Paginace -->
  <div class="pagination" id="pagination"></div>

  <!-- Reklama dole -->
  <div class="ad-banner"></div>
  <a href="index.html" data-i18n="back">Back to selection</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'nasta.theruss';

    // Manuálně pošleme pageview s id postavy v URL (pro Plausible)
    if (window.plausible) {
      const customPath = '/gallery.html/' + id;
      plausible('pageview', { url: location.origin + customPath });
      console.log("Plausible manuálně poslal: " + customPath);
    }

    const photosPerPage = 20;
    let currentPage = 1;
    let allPhotos = [];

    // Globální počty pod názvem postavy
    if (window.likeFunctions) {
      window.likeFunctions.listenLikes(id, (data) => {
        document.getElementById('more-like-count').textContent = data.likes || 0;
        document.getElementById('more-dislike-count').textContent = data.dislikes || 0;
      });
    }

    // Kliky pod názvem postavy
    document.getElementById('more-like-btn').onclick = () => {
      if (window.likeFunctions) window.likeFunctions.likePost(id);
    };

    document.getElementById('more-dislike-btn').onclick = () => {
      if (window.likeFunctions) window.likeFunctions.dislikePost(id);
    };

    fetch(`postavy/${id}.txt`)
      .then(response => {
        if (!response.ok) throw new Error(`File not found (status ${response.status})`);
        return response.text();
      })
      .then(text => {
        const lines = text.trim().split('\n');
        allPhotos = [];
        for (let i = 0; i < lines.length; i += 2) {
          const thumb = lines[i]?.trim() || '';
          const full = lines[i + 1]?.trim() || '';
          if (full) allPhotos.push({ thumb, full });
        }
        document.getElementById('postava-name').textContent =
          allPhotos.length === 0
            ? `${id} - no items`
            : `${id} - ${allPhotos.length} items`;
        renderPage(currentPage);
        renderPagination();
      })
      .catch(err => {
        console.error('Error:', err);
        document.getElementById('postava-name').textContent = 'Character not found – check file postavy/' + id + '.txt';
      });

    function renderPage(page) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      const UNIVERSAL_VIDEO_THUMB = "video-universal-thumb.png";
      const start = (page - 1) * photosPerPage;
      const end = Math.min(start + photosPerPage, allPhotos.length);
      const pagePhotos = allPhotos.slice(start, end);

      pagePhotos.forEach(f => {
        const isVideo = /\.(mp4|webm|mov)$/i.test(f.full);
        let thumbSrc = f.thumb || UNIVERSAL_VIDEO_THUMB;
        if (!thumbSrc) thumbSrc = "placeholder.jpg";

        const item = document.createElement('div');
        item.className = 'item';

        let playIcon = '';
        if (isVideo) {
          playIcon = '<div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:60px; color:#ff3366; text-shadow:0 0 12px black; pointer-events:none; opacity:0.9;">▶</div>';
        }

        item.innerHTML = `
          <a href="redirect.html?url=${encodeURIComponent(f.full)}" target="_blank" rel="noopener" style="position:relative; display:block;">
            <img src="${thumbSrc}" alt="${isVideo ? 'Video' : 'Photo'}" loading="lazy">
            ${playIcon}
            <div class="name">Click for ${isVideo ? 'VIDEO 🔥' : 'full'}</div>
          </a>
        `;

        // === Lajky + Dislajky pod fotkou ===
        const postavaId = f.thumb.split('/').pop().split('.')[0] ||
                          f.full.split('/').pop().split('.')[0] ||
                          id;

        const likeContainer = document.createElement('div');
        likeContainer.style.marginTop = '8px';
        likeContainer.style.display = 'flex';
        likeContainer.style.justifyContent = 'center';
        likeContainer.style.gap = '10px';

        const likeButton = document.createElement('button');
        likeButton.innerHTML = '❤️';
        likeButton.style.background = 'transparent';
        likeButton.style.border = '2px solid #ff3366';
        likeButton.style.borderRadius = '50%';
        likeButton.style.cursor = 'pointer';
        likeButton.style.fontSize = '16px';
        likeButton.style.color = '#ff3366';

        const likeCount = document.createElement('span');
        likeCount.innerText = ' 0';
        likeCount.style.marginLeft = '2px';

        likeButton.appendChild(likeCount);
        likeContainer.appendChild(likeButton);

        const dislikeButton = document.createElement('button');
        dislikeButton.innerHTML = '👎';
        dislikeButton.style.background = 'transparent';
        dislikeButton.style.border = '2px solid #ff3366';
        dislikeButton.style.borderRadius = '50%';
        dislikeButton.style.cursor = 'pointer';
        dislikeButton.style.fontSize = '16px';
        dislikeButton.style.color = '#ff3366';

        const dislikeCount = document.createElement('span');
        dislikeCount.innerText = ' 0';
        dislikeCount.style.marginLeft = '2px';

        dislikeButton.appendChild(dislikeCount);
        likeContainer.appendChild(dislikeButton);

        likeButton.onclick = () => {
          if (window.likeFunctions) window.likeFunctions.likePost(postavaId);
          console.log("Like added for ID: " + postavaId);
        };

        dislikeButton.onclick = () => {
          if (window.likeFunctions) window.likeFunctions.dislikePost(postavaId);
          console.log("Dislike added for ID: " + postavaId);
        };

        if (window.likeFunctions) {
          window.likeFunctions.listenLikes(postavaId, (data) => {
            likeCount.innerText = ` ${data.likes || 0}`;
            dislikeCount.innerText = ` ${data.dislikes || 0}`;
            console.log("Updated for ID " + postavaId + ": ❤️" + (data.likes || 0) + " 👎" + (data.dislikes || 0));
          });
        }

        item.appendChild(likeContainer);
        gallery.appendChild(item);
      });
    }

    function renderPagination() {
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      const totalPages = Math.ceil(allPhotos.length / photosPerPage);
      const prev = document.createElement('button');
      prev.textContent = '◀ Previous';
      prev.disabled = currentPage === 1;
      prev.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderPage(currentPage);
          updatePagination();
        }
      };
      pagination.appendChild(prev);

      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, startPage + 4);
      if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.onclick = () => {
          currentPage = i;
          renderPage(currentPage);
          updatePagination();
        };
        pagination.appendChild(btn);
      }

      const next = document.createElement('button');
      next.textContent = 'Next ▶';
      next.disabled = currentPage === totalPages;
      next.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderPage(currentPage);
          updatePagination();
        }
      };
      pagination.appendChild(next);
    }

    function updatePagination() {
      const buttons = document.querySelectorAll('.pagination button');
      buttons.forEach(btn => {
        btn.className = (btn.textContent === currentPage.toString()) ? 'active' : '';
      });
    }

    // Jazykový systém (stejný jako v indexu)
    const translations = {
      cs: {
        title: "Galerie (18+)",
        warning: "⚠️ 18+ NSFW obsah – pouze pro dospělé. Stránka používá cookies pro reklamy.",
        loading: "Načítání galerie...",
        moreContent: "Chtěli byste více contentu?",
        back: "Zpět na výběr"
      },
      en: {
        title: "Gallery (18+)",
        warning: "⚠️ 18+ NSFW content – adults only. This site uses cookies for ads.",
        loading: "Loading gallery...",
        moreContent: "Would you like more content?",
        back: "Back to selection"
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en'; // default angličtina

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      document.getElementById('lang-cs').classList.toggle('active', lang === 'cs');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    }

    // Přepínač
    document.getElementById('lang-cs').onclick = () => applyLanguage('cs');
    document.getElementById('lang-en').onclick = () => applyLanguage('en');

    // Načti jazyk při startu
    applyLanguage(currentLang);
  </script>
</body>
</html>
