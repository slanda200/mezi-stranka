    const translations = {

        warning: "⚠️ 18+ NSFW obsah – pouze pro dospělé. Stránka používá cookies pro reklamy.",

        redirecting: "Redirecting you...",
        pleaseWait: "Please wait a moment... 🔥",
        manualButton: "Open content 🔥"
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      document.getElementById('lang-cs').classList.toggle('active', lang === 'cs');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    }

    document.getElementById('lang-cs').onclick = () => applyLanguage('cs');
    document.getElementById('lang-en').onclick = () => applyLanguage('en');

    applyLanguage(currentLang);

    // Získej cílový URL
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || 'https://quickpic.site';

    // Odpočet 3...2...1...0
    let seconds = 3;
    const countdownEl = document.getElementById('countdown');
    const interval = setInterval(() => {
      seconds--;
      countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        countdownEl.textContent = '0';
        // Automatické otevření
        window.open(targetUrl, '_blank');
      }
    }, 1000);

    // Ruční klik na tlačítko (funguje hned)
    document.getElementById('manual-btn').onclick = function() {
      window.open(targetUrl, '_blank');
      clearInterval(interval); // zastav odpočet
      this.style.background = '#4CAF50'; // zelené po kliku
      this.textContent = currentLang === 'cs' ? 'Otevřeno!' : 'Opened!';
    };
