<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Redirecting...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #ff3366;
    }
    p {
      font-size: 18px;
      max-width: 600px;
    }
  </style>

  <!-- Adsterra Popunder (spustí se při načtení stránky) -->
  <script src="https://demolitionculpritrape.com/68/65/dc/6865dc7a977c43fd392abb7d98bced45.js"></script>

  <!-- Jazykový systém – stejný jako v index/gallery -->
</head>
<body>
  <!-- Logo – stejné jako v index/gallery, vlevo nahoře -->
  <div style="position: fixed; top: 20px; left: 5%; z-index: 999;">
    <a href="index.html">
      <img src="logo.png" alt="QuickPic Logo" style="width: 80px; height: auto; border-radius: 50%; box-shadow: 0 0 10px #000;">
    </a>
  </div>

  <!-- Jazykový přepínač (volitelně, pokud chceš) -->
  <div id="lang-switch" style="position: fixed; top: 20px; right: 20px; z-index: 999; font-size: 16px; background: #222; padding: 8px 15px; border-radius: 8px; box-shadow: 0 0 10px #000;">
    <a id="lang-cs">CZ</a> | <a id="lang-en" class="active">EN</a>
  </div>

  <div class="warning" data-i18n="warning" style="margin-top: 100px;">⚠️ 18+ NSFW content – adults only. This site uses cookies for ads.</div>

  <h1 data-i18n="redirecting">Redirecting you...</h1>
  <p data-i18n="pleaseWait">Please wait a moment... 🔥</p>

  <script>
    // Jazykový systém (stejný jako v index/gallery)
    const translations = {
      cs: {
        title: "Přesměrování...",
        warning: "⚠️ 18+ NSFW obsah – pouze pro dospělé. Stránka používá cookies pro reklamy.",
        redirecting: "Přesměrováváme tě...",
        pleaseWait: "Počkej prosím chvíli... 🔥"
      },
      en: {
        title: "Redirecting...",
        warning: "⚠️ 18+ NSFW content – adults only. This site uses cookies for ads.",
        redirecting: "Redirecting you...",
        pleaseWait: "Please wait a moment... 🔥"
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en'; // default angličtina

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      document.getElementById('lang-cs').classList.toggle('active', lang === 'cs');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    }

    // Přepínač
    document.getElementById('lang-cs').onclick = () => applyLanguage('cs');
    document.getElementById('lang-en').onclick = () => applyLanguage('en');

    // Načti jazyk při startu
    applyLanguage(currentLang);

    // Automatické přesměrování po 1.5 sekundě + spuštění popunderu
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || 'https://quickpic.site'; // fallback

    setTimeout(() => {
      window.open(targetUrl, '_blank'); // otevře v novém tabu
    }, 1500);
  </script>
</body>
</html>
