<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přesměrování...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #ff3366;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
      max-width: 600px;
    }
    .button {
      background: #ff3366;
      color: white;
      padding: 18px 40px;
      font-size: 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255,51,102,0.5);
    }
    .button:hover {
      background: #ff1a4d;
      transform: scale(1.05);
    }
  </style>

  <!-- Tvůj Adsterra Popunder script (hlavní zdroj peněz) – vlož svůj aktuální -->

  <!-- Pokud máš anti-adblock, přidej ho sem -->

  <!-- Volitelně: starý banner, pokud chceš nechat -->
  <!-- <script src="https://www.highperformanceformat.com/2b2844954e2220b902ad439f350a7388/invoke.js"></script> -->
</head>
<body>

  <h1>Připravujeme fotku/video...</h1>
  <p>Klikni na tlačítko níže a otevře se obsah 🔥 (reklamy nás drží zdarma – díky za pochopení!)</p>

  <button id="go-btn" class="button">Otevřít fotku/video 🔥</button>

  <script>
    // Získej cílový URL z query parametru (?url=...)
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || 'https://quickpic.site'; // fallback

    // Po kliknutí na tlačítko: spustí popunder (Adsterra to udělá automaticky při interakci) + otevře fotku
    document.getElementById('go-btn').onclick = function() {
      // Adsterra popunder se spustí sám při kliku (nemusíš nic dělat navíc)
      window.open(targetUrl, '_blank'); // otevře v novém tabu
    };
  </script>

</body>
</html>
