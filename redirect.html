<body>

  <h1>Přesměrováváme tě...</h1>
  <p>Klikni na tlačítko níže a otevře se fotka/video 🔥 (reklamy nás drží zdarma, díky za pochopení!)</p>

  <a href="#" id="redirect-btn" class="button">Otevřít fotku/video 🔥</a>

  <script>
    // Získej URL z adresního řádku (např. redirect.html?url=https://... )
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || 'https://quickpic.site'; // fallback

    // Tlačítko – při kliknutí spustí popunder (Adsterra to udělá samo) a otevře cíl
    document.getElementById('redirect-btn').onclick = function(e) {
      e.preventDefault();
      // Adsterra popunder se spustí automaticky při interakci (klik)
      window.open(targetUrl, '_blank'); // otevře v novém tabu
    };
  </script>
